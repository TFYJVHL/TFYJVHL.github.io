<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攻防战场 · 双人自由 / 无尽塔防</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo"></span>
      <div>
        <h1>攻防战场</h1>
        <p>点击部署 · 长按拖动 · 双指拆除</p>
      </div>
    </div>

    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="versus">双人自由模式</button>
      <button class="mode-btn" data-mode="endless">无尽模式</button>
    </div>

    <div class="hud">
      <div class="hud-item"><span class="hud-k">阶段</span><span class="hud-v" id="statPhase">—</span></div>
      <div class="hud-item" id="boxDef"><span class="hud-k">防御方金币</span><span class="hud-v gold" id="statGoldDef">0</span></div>
      <div class="hud-item" id="boxAtk"><span class="hud-k">攻击方金币</span><span class="hud-v atk" id="statGoldAtk">0</span></div>
      <div class="hud-item" id="boxGold"><span class="hud-k">金币</span><span class="hud-v gold" id="statGold">0</span></div>
      <div class="hud-item" id="boxCastle"><span class="hud-k">城堡</span><span class="hud-v life" id="statCastle">0</span></div>
      <div class="hud-item" id="boxHq"><span class="hud-k">大本营</span><span class="hud-v life" id="statHq">0</span></div>
      <div class="hud-item" id="boxRound"><span class="hud-k">轮次</span><span class="hud-v" id="statRound">0</span></div>
      <div class="hud-item" id="boxWave"><span class="hud-k">波次</span><span class="hud-v" id="statWave">0</span></div>
      <div class="hud-item"><span class="hud-k">击杀</span><span class="hud-v" id="statKills">0</span></div>
      <div class="hud-item" id="boxUnits"><span class="hud-k">场上敌人</span><span class="hud-v" id="statUnits">0</span></div>
      <div class="hud-item" id="boxBest"><span class="hud-k">最高纪录</span><span class="hud-v gold" id="statBest">—</span></div>
      <div class="hud-item wide" id="boxNext"><span class="hud-k">下波预告</span><span class="hud-v" id="statNext">—</span></div>
    </div>
  </header>

  <main class="stage">
    <div class="canvas-wrap">
      <canvas id="game"></canvas>
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h2 id="ovTitle">准备</h2>
          <p id="ovText"></p>
          <button class="btn primary big" id="ovBtn">开始</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="dock">
      <div class="dock-head">
        <div class="dh-left">
          <span class="badge" id="turnBadge">防御方</span>
          <span id="hintText">选择下方建筑，点击地图空地部署</span>
        </div>
        <div class="dh-right" id="costHint">花费提示：—</div>
      </div>

      <div class="cards" id="cards"></div>

      <!-- 建筑详情面板：点击地图上已建的建筑打开 -->
      <div class="info hidden" id="infoPanel">
        <div class="ip-head">
          <span class="ip-name" id="ipName">—</span>
          <span class="ip-lv" id="ipLv">Lv.1</span>
          <button class="btn ghost tiny" id="ipClose">关闭</button>
        </div>
        <div class="ip-stats" id="ipStats"></div>
        <div class="ip-actions">
          <button class="btn primary" id="ipUpgrade">升级</button>
          <button class="btn" id="ipRepair">修复</button>
          <span class="ip-tip" id="ipTip"></span>
        </div>
        <p class="ip-brief" id="ipBrief"></p>
      </div>

      <div class="dock-foot">
        <button class="btn primary" id="btnMain">完成部署</button>
        <button class="btn" id="btnPause">暂停</button>
        <button class="btn" id="btnSpeed">速度 ×1</button>
        <button class="btn ghost" id="btnCancel">取消选择</button>
        <button class="btn ghost" id="btnDestroy">拆除：关</button>
        <button class="btn ghost" id="btnMusic">音乐：开</button>
        <input class="slider" id="volMusic" type="range" min="0" max="100" step="5" value="50" title="音乐音量">
        <button class="btn ghost" id="btnSound">音效：关</button>
        <input class="slider" id="volSfx" type="range" min="0" max="100" step="5" value="70" title="音效音量">
        <button class="btn ghost" id="btnRestart">重新开始</button>
        <span class="tips-inline">左键 = 部署　右键 = 摧毁（返还金币）　滚轮 = 翻卡片　点建筑 = 详情　｜　触屏：轻点部署 · 长按拖动 · 双指拆除</span>
        <span class="tips-mobile">触屏：选卡片后轻点地图部署 · 长按建筑可拖动 · 双指轻点或「拆除」按钮可移除 · 点建筑看详情</span>
      </div>
    </div>
  </main>
</div>
<script src="defs.js"></script>
<script src="game.js"></script>
</body>
</html>
